name: Build TrueAuth

on:
  push:
  pull_request:

jobs:
  build-1-20:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode clean package -Pmc-1.20 -DskipTests
      - run: mvn --batch-mode clean package -Pspigot-1.20 -DskipTests

  build-1-21:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode clean package -Pmc-1.21 -DskipTests
      - run: mvn --batch-mode clean package -Pspigot-1.21 -DskipTests

  build-26:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode clean package -Pmc-26-1 -DskipTests
      - run: mvn --batch-mode clean package -Pmc-26 -DskipTests

  build-sponge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode -f sponge/pom.xml clean package -DskipTests

  build-proxies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode -f proxy-common/pom.xml clean install -DskipTests
      - run: mvn --batch-mode -f velocity/pom.xml clean package -DskipTests
      - run: mvn --batch-mode -f waterfall/pom.xml clean package -DskipTests
